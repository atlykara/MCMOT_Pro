# Kayseri MOBESE kamera yapilandirmasi
#
# Proje standart calisma videosu: 20 FPS'e dusurulmus kopyalar.
# Orijinal ham videolar masaustunde kalir; analizler data/cams altindaki
# sabit FPS dosyalari uzerinden yapilir.

cameras:
  - camera_id: camA
    video_path: "data/cams/camA_20fps.mp4"
    fps: 20
    clock_offset_seconds: 0.0
    notes: "Kayseri MOBESE kamera 1, 1728x1080, 20 FPS calisma kopyasi"

  - camera_id: camB
    video_path: "data/cams/camB_20fps.mp4"
    fps: 20
    clock_offset_seconds: 0.0
    notes: "Kayseri MOBESE kamera 2, 1920x1080, 20 FPS calisma kopyasi"

