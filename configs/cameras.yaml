# MCMOT_Pro — kamera yapılandırma şablonu
# Her kamera girdisi için alanlar:
#   camera_id            : kamera kimliği (ör. camA)
#   video_path           : video dosyasının yolu
#   fps                  : videonun kare hızı
#   clock_offset_seconds : kameranın referans saate göre zaman kayması (saniye)
#   notes                : serbest not alanı

cameras:
  - camera_id: camA
    video_path: ""
    fps: 0
    clock_offset_seconds: 0.0
    notes: ""

  - camera_id: camB
    video_path: ""
    fps: 0
    clock_offset_seconds: 0.0
    notes: ""
