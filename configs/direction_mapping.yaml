# Faz 2 -> Faz 3 hareket yonu esleme konfigurasyonu
#
# Yeni ROI dosyalarinda zone_id adlari giris/cikis mantigiyla tanimli:
#   camA_exit  : camA'dan camB yonune cikis
#   camA_entry : camB'den camA yonune giris
#   camB_exit  : camB'den camA yonune cikis
#   camB_entry : camA'dan camB yonune giris

cameras:
  camA:
    zone_movement:
      camA_exit: camA_to_camB
      camA_entry: camB_to_camA
  camB:
    zone_movement:
      camB_exit: camB_to_camA
      camB_entry: camA_to_camB

# Kalite esikleri: bunlarin altindaki track'ler gurultu kabul edilip
# movement_label = other yapilir (Faz 3'te ana aday olmazlar).
quality:
  min_distance_px: 25
  min_num_points: 5
  min_duration_s: 0.3

